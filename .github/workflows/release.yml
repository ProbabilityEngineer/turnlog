name: Release binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify version
        shell: bash
        run: |
          expected="turnlog $(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          actual="$(./target/${{ matrix.target }}/release/turnlog --version)"
          test "$actual" = "$expected"
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/turnlog-${{ matrix.name }}.tar.gz turnlog
          shasum -a 256 dist/turnlog-${{ matrix.name }}.tar.gz > dist/turnlog-${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: turnlog-${{ matrix.name }}
          path: dist/turnlog-${{ matrix.name }}.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: turnlog-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
